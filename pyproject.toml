[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<1.8", "imbalanced-learn>=0.13,<0.15", "xgboost>=2.1,<4", "matplotlib>=3.9,<4", "PyYAML>=6,<7", "joblib>=1.4,<2"]

[project.optional-dependencies]
serving = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]
tracking = ["mlflow>=3,<4"]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8", "jupyterlab>=4,<5"]

[project.scripts]
fraud-train = "fraud_detection.train:main"
fraud-eda = "fraud_detection.eda:main"
fraud-export = "fraud_detection.deployment:main"
fraud-track = "fraud_detection.tracking:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100


[tool.ruff.lint.isort]
known-third-party = ["mlflow"]
