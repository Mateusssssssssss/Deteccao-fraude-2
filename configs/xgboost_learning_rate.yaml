# Nova rodada: preserva os artefatos da busca anterior com learning_rate fixo.
experiment_name: xgboost_learning_rate
reuse_from: .
reuse_prefix: xgboost_gridsearch
primary_metric: f1
threshold: 0.5
cv_splits: 3
sampling_ratio: 0.1
model_n_jobs: 2
search_n_jobs: 2
permutation_repeats: 3
iteration_points: [25, 50, 100, 200, 400]
param_grid:
  max_depth: [3, 4, 6]
  n_estimators: [100, 200, 400]
  reg_alpha: [0.0, 1.0]
  reg_lambda: [0.0, 1.0, 5.0]
  learning_rate: [0.01, 0.05, 0.1]
# 162 combinações; se os protocolos coincidirem, reutiliza as 54 anteriores de 0,05.
# A busca mantém F1, threshold 0,50 e validação temporal dentro de TRAIN.
