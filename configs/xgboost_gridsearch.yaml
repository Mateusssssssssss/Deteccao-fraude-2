# Busca pequena e explícita; nenhuma otimização ou avaliação no TEST.
primary_metric: f1
threshold: 0.5
cv_splits: 3
sampling_ratio: 0.1
model_n_jobs: 2
search_n_jobs: 1
permutation_repeats: 3
iteration_points: [25, 50, 100, 200, 400]
param_grid:
  max_depth: [3, 4, 6]
  n_estimators: [100, 200, 400]
  reg_alpha: [0.0, 1.0]
  reg_lambda: [0.0, 1.0, 5.0]
# learning_rate, subsample, colsample_bytree e min_child_weight permanecem fixos.
# 54 combinações x 3 folds = 162 fits; depois refit no prefixo do TRAIN.
